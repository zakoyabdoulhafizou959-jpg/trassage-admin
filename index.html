<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Surveillance Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px;
            border-radius: 24px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .user-selector {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 1rem;
            margin-top: 8px;
        }

        .live-viewer {
            background: black;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 24px;
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .live-viewer img {
            width: 100%;
            height: auto;
            background: black;
            display: none;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .fullscreen-btn {
            background: #1e293b;
            color: white;
        }

        .status {
            background: #1e293b;
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .live-badge {
            background: #dc2626;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            animation: pulse 1s infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .user-info {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
        }

        .connection-log {
            background: #1e293b;
            color: #94a3b8;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            margin-top: 8px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
        }

        .placeholder-text {
            color: white;
            text-align: center;
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Administration - Live View</h1>
            <p>Visualisation en temps réel (flux photo en continu)</p>
        </div>

        <div class="user-selector">
            <label>👤 Sélectionner un utilisateur:</label>
            <select id="userSelect">
                <option value="">-- Chargement des utilisateurs --</option>
            </select>
        </div>

        <div id="userInfo" class="user-info"></div>

        <div class="live-viewer" id="liveViewer">
            <img id="liveImage" alt="Flux vidéo">
            <div class="placeholder-text" id="placeholder">📭 En attente du flux...</div>
        </div>

        <div class="controls">
            <button id="connectBtn" class="btn-primary">🔗 Activer le live</button>
            <button id="disconnectBtn" class="btn-danger" disabled>⏹️ Désactiver</button>
            <button id="fullscreenBtn" class="fullscreen-btn" disabled>🖥️ Plein écran</button>
            <button id="debugBtn" style="background:#475569;">🐛 Debug</button>
        </div>

        <div id="status" class="status">
            💡 Sélectionnez un utilisateur
        </div>
        <div id="connectionLog" class="connection-log"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, onValue, off } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCiTlZ2IyY-y4vOHi0zrvHsp-Ro95wzFaU",
            authDomain: "universite-taak.firebaseapp.com",
            databaseURL: "https://universite-taak-default-rtdb.firebaseio.com",
            projectId: "universite-taak",
            storageBucket: "universite-taak.firebasestorage.app",
            messagingSenderId: "550634728649",
            appId: "1:550634728649:web:12147e8dec3a04618c3118",
            measurementId: "G-RD7KY6BFP4"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let currentUserId = null;
        let frameListener = null;

        const liveImage = document.getElementById('liveImage');
        const placeholder = document.getElementById('placeholder');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const debugBtn = document.getElementById('debugBtn');
        const statusDiv = document.getElementById('status');
        const connectionLog = document.getElementById('connectionLog');
        const userSelect = document.getElementById('userSelect');
        const userInfoDiv = document.getElementById('userInfo');

        let frameCount = 0;
        let lastFpsUpdate = Date.now();

        function addLog(message) {
            const time = new Date().toLocaleTimeString();
            connectionLog.innerHTML = `[${time}] ${message}<br>` + connectionLog.innerHTML;
            console.log(`[${time}] ${message}`);
        }

        function setStatus(message, isLive = false) {
            statusDiv.innerHTML = message;
            if (isLive) {
                statusDiv.style.background = '#dc2626';
                statusDiv.innerHTML += ' <span class="live-badge">LIVE</span>';
            } else {
                statusDiv.style.background = '#1e293b';
            }
        }

        // Charger les utilisateurs actifs
        function loadUsers() {
            const usersRef = ref(database, 'users');
            onValue(usersRef, (snapshot) => {
                const users = snapshot.val();
                userSelect.innerHTML = '<option value="">-- Sélectionner un utilisateur --</option>';
                
                if (users) {
                    Object.keys(users).forEach(userId => {
                        if (users[userId].active === true) {
                            userSelect.innerHTML += `<option value="${userId}">👤 Utilisateur #${userId.slice(-6)} (Actif)</option>`;
                        }
                    });
                }
                
                if (userSelect.options.length === 1) {
                    userSelect.innerHTML = '<option value="">-- Aucun utilisateur actif --</option>';
                }
            });
        }

        // Charger les infos GPS
        function loadUserInfo(userId) {
            const locationRef = ref(database, `users/${userId}/location`);
            onValue(locationRef, (snapshot) => {
                const location = snapshot.val();
                if (location) {
                    userInfoDiv.style.display = 'block';
                    userInfoDiv.innerHTML = `
                        <strong>📍 Position GPS:</strong><br>
                        Latitude: ${location.lat}<br>
                        Longitude: ${location.lng}<br>
                        <a href="https://www.google.com/maps?q=${location.lat},${location.lng}" 
                           target="_blank" style="color: #667eea;">
                            🗺️ Voir sur Google Maps
                        </a>
                        <br><small>Dernière mise à jour: ${new Date(location.timestamp).toLocaleString()}</small>
                    `;
                } else {
                    userInfoDiv.style.display = 'none';
                }
            });
        }

        // Connexion au flux d'images
        function connectToUser() {
            currentUserId = userSelect.value;
            if (!currentUserId) {
                setStatus("⚠️ Sélectionnez un utilisateur d'abord");
                return;
            }

            setStatus("🔄 Connexion au flux d'images...");
            connectBtn.disabled = true;
            
            addLog(`📡 Connexion à l'utilisateur: ${currentUserId}`);
            
            // Réinitialiser le compteur
            frameCount = 0;
            lastFpsUpdate = Date.now();
            
            // Écouter les frames sur Firebase
            const frameRef = ref(database, `live/${currentUserId}/frame`);
            
            frameListener = onValue(frameRef, (snapshot) => {
                const frame = snapshot.val();
                if (frame && frame.image) {
                    // Afficher l'image
                    liveImage.src = frame.image;
                    
                    if (liveImage.style.display === 'none') {
                        liveImage.style.display = 'block';
                        placeholder.style.display = 'none';
                        setStatus("🔴 LIVE - Flux de photos reçu", true);
                        fullscreenBtn.disabled = false;
                        addLog("✅ Première image reçue avec succès !");
                    }
                    
                    // Calculer les FPS
                    frameCount++;
                    const now = Date.now();
                    if (now - lastFpsUpdate >= 1000) {
                        const fps = frameCount;
                        addLog(`📊 FPS: ${fps} images/seconde`);
                        frameCount = 0;
                        lastFpsUpdate = now;
                        setStatus(`🔴 LIVE - ${fps} fps`, true);
                    }
                } else {
                    addLog("⚠️ En attente d'image...");
                }
            });
            
            loadUserInfo(currentUserId);
            disconnectBtn.disabled = false;
            
            // Timeout si aucune image après 5 secondes
            setTimeout(() => {
                if (liveImage.style.display === 'none') {
                    addLog("❌ Aucune image reçue après 5 secondes");
                    setStatus("⚠️ Aucun flux - L'utilisateur a-t-il démarré le partage ?");
                }
            }, 5000);
        }

        function disconnect() {
            addLog("🔌 Déconnexion...");
            
            if (frameListener) {
                off(frameListener);
                frameListener = null;
            }
            
            liveImage.src = "";
            liveImage.style.display = 'none';
            placeholder.style.display = 'block';
            userInfoDiv.style.display = 'none';
            
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            fullscreenBtn.disabled = true;
            
            setStatus("🔌 Déconnecté");
            addLog("🔌 Déconnecté");
        }

        function toggleFullscreen() {
            const viewer = document.getElementById('liveViewer');
            if (!viewer) return;
            
            if (!document.fullscreenElement) {
                viewer.requestFullscreen().catch(err => {
                    console.error(err);
                    addLog(`❌ Erreur plein écran: ${err.message}`);
                });
                addLog("🖥️ Mode plein écran activé");
            } else {
                document.exitFullscreen();
                addLog("🖥️ Mode plein écran désactivé");
            }
        }

        function debug() {
            addLog(`=== DEBUG ===`);
            addLog(`Utilisateur sélectionné: ${currentUserId || 'aucun'}`);
            addLog(`Image affichée: ${liveImage.style.display}`);
            addLog(`Source image: ${liveImage.src ? liveImage.src.substring(0, 50) + '...' : 'vide'}`);
            addLog(`Dimensions image: ${liveImage.naturalWidth}x${liveImage.naturalHeight}`);
            addLog(`Listener actif: ${frameListener ? 'oui' : 'non'}`);
        }

        connectBtn.addEventListener('click', connectToUser);
        disconnectBtn.addEventListener('click', disconnect);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        debugBtn.addEventListener('click', debug);
        
        userSelect.addEventListener('change', () => {
            if (frameListener) {
                disconnect();
            }
        });

        // Charger les utilisateurs au démarrage
        loadUsers();
        addLog("🚀 Page admin chargée - En attente de sélection utilisateur");
    </script>
</body>
</html>
